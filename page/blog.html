<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Howieze</title>
    <link rel="icon" href="../img/Spartan.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../style/index.css" />
    <style>
      .blog-container {
        width: 700px;
        max-width: 90%;
        margin: 40px auto;
        background: white;
        border: 1px solid #ccc;
        padding: 30px;
      }

      .blog-header {
        border-bottom: 1px solid #000;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .blog-header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 2px;
      }

      .blog-post {
        margin-bottom: 40px;
      }

      .blog-post-header {
        margin-bottom: 15px;
      }

      .blog-post h2 {
        font-size: 20px;
        margin: 0 0 5px;
        display: inline;
      }

      .blog-post .date {
        font-size: 12px;
        color: #666;
        margin-left: 10px;
      }

      .blog-post-content {
        line-height: 1.6;
      }

      .blog-post-content p {
        margin: 0;
      }

      .blog-divider {
        border: none;
        border-top: 1px solid #000;
        margin: 30px 0;
      }

      .blog-video {
        width: 100%;
        max-width: 560px;
        margin: 30px auto 0;
        border: 1px solid #ccc;
        background: #f7f7f7;
        aspect-ratio: 16 / 9;
      }

      .blog-video iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 600px) {
        .blog-container {
          padding: 20px;
        }

        .blog-post h2 {
          display: block;
        }

        .blog-post .date {
          display: block;
          margin: 5px 0 0;
        }
      }
    </style>
  </head>
  <body class="body">
    <button id="lang-toggle" class="language-toggle" type="button" aria-label="Toggle language">ES / EN</button>
    <main class="page-content">
      <div class="blog-container">
      <div class="blog-header">
        <h1 data-i18n="blogTitle">BLOG</h1>
      </div>

      <div class="blog-post">
        <div class="blog-post-header">
          <h2 data-i18n="blogPostTitle1">Primer semestre</h2>
          <span class="date" data-i18n="blogDate1">16 de marzo de 2026</span>
        </div>
        <div class="blog-post-content">
          <p data-i18n="blogPost1">Primer video a principios de invierno.</p>
        </div>
      </div>

      <hr class="blog-divider" />

      <div class="blog-post">
        <div class="blog-post-header">
          <h2 data-i18n="blogPostTitle2">Blog iniciado</h2>
          <span class="date" data-i18n="blogDate2">2 de Septiembre de 2026</span>
        </div>
        <div class="blog-post-content">
          <p data-i18n="blogPost2">Este video de Jon es muy cinematografico me encanta</p>
        </div>
      </div>

      <div class="blog-video" aria-label="Video de YouTube">
        <iframe
          src="https://www.youtube.com/embed/7qWFOYLowEc?si=PswKpy7tjr87Mlck" 
          title="Video de YouTube"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
    </div>
    </main>
    <div class="copyright">
      <a href="https://www.youtube.com/@howieze">© Howieze 2026</a>
    </div>
    <div class="home_link">
      <a href="home.html" data-i18n="homeLink">Home</a>
    </div>

    <script src="../script.js"></script>
  </body>
</html>
