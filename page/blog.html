<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Howieze</title>
    <link rel="icon" href="../img/me.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../style/index.css" />
    <style>
      .blog-container {
        width: 700px;
        max-width: 90%;
        margin: 40px auto;
        background: white;
        border: 1px solid #ccc;
        padding: 30px;
      }

      .blog-header {
        border-bottom: 1px solid #000;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .blog-header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 2px;
      }

      .blog-post {
        margin-bottom: 40px;
      }

      .blog-post-header {
        margin-bottom: 15px;
      }

      .blog-post h2 {
        font-size: 20px;
        margin: 0 0 5px;
        display: inline;
      }

      .blog-post .date {
        font-size: 12px;
        color: #666;
        margin-left: 10px;
      }

      .blog-post-content {
        line-height: 1.6;
      }

      .blog-post-content p {
        margin: 0;
      }

      .blog-divider {
        border: none;
        border-top: 1px solid #000;
        margin: 30px 0;
      }
    </style>
  </head>
  <body class="body">
    <button id="lang-toggle" class="language-toggle" type="button" aria-label="Toggle language">ES / EN</button>
    <main class="page-content">
      <div class="blog-container">
      <div class="blog-header">
        <h1 data-i18n="blogTitle">BLOG</h1>
      </div>

      <div class="blog-post">
        <div class="blog-post-header">
          <h2 data-i18n="blogPostTitle1">First semester</h2>
          <span class="date">March 16, 2026</span>
        </div>
        <div class="blog-post-content">
          <p data-i18n="blogPost1">Primer video a principios de invierno.</p>
        </div>
      </div>

      <hr class="blog-divider" />

      <div class="blog-post">
        <div class="blog-post-header">
          <h2 data-i18n="blogPostTitle2">Blog Iniciado</h2>
          <span class="date">January 1, 2026</span>
        </div>
        <div class="blog-post-content">
          <p data-i18n="blogPost2">Sup, nuevo blog! Aca voy a ir publicando actualizaciones.</p>
        </div>
      </div>
    </div>
    </main>
    <div class="copyright">
      <a href="https://www.youtube.com/@howieze">© Howieze 2026</a>
    </div>
    <div class="home_link">
      <a href="home.html" data-i18n="homeLink">Home</a>
    </div>
  </body>
</html>
